name: CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: arxiv-mcp
            artifact: arxiv-mcp-x86_64-unknown-linux-gnu
          - os: macos-latest
            binary: arxiv-mcp
            artifact: arxiv-mcp-aarch64-apple-darwin
          - os: windows-latest
            binary: arxiv-mcp.exe
            artifact: arxiv-mcp-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Build (release)
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

      - name: Rename binary
        shell: bash
        run: cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## arxiv-mcp ${{ github.ref_name }}

            An MCP server that lets AI assistants search arXiv, fetch paper metadata and BibTeX citations, and download paper sources to a local cache.

            ### Install

            Download the binary for your platform below and place it somewhere on your `PATH`:

            | Platform | Binary |
            |----------|--------|
            | Linux (x86_64) | `arxiv-mcp-x86_64-unknown-linux-gnu` |
            | macOS (Apple Silicon) | `arxiv-mcp-aarch64-apple-darwin` |
            | Windows (x86_64) | `arxiv-mcp-x86_64-pc-windows-msvc.exe` |

            Then add to your MCP host config (e.g. Claude Desktop):

            ```json
            {
              "mcpServers": {
                "arxiv": { "command": "arxiv-mcp" }
              }
            }
            ```

            ---
          files: binaries/*
