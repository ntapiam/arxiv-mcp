[package]
name = "arxiv-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
tar = "0.4"
flate2 = "1"
dirs = "6"
anyhow = "1"
